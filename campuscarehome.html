<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusCare</title>
  <meta name="description" content="CampusCare is a modern university student support portal for career guidance, mental health, complaints, mentoring, and campus resources." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles/premium.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            campus: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            }
          },
          boxShadow: {
            soft: '0 18px 45px rgba(37, 99, 235, 0.10)',
            glow: '0 12px 30px rgba(37, 99, 235, 0.16)'
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          },
          keyframes: {
            floaty: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' }
            },
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          },
          animation: {
            floaty: 'floaty 6s ease-in-out infinite',
            fadeUp: 'fadeUp 0.7s ease-out both'
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --brand-primary: #2563EB;
      --brand-secondary: #7C3AED;
      --brand-accent: #7C3AED;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 8%, rgba(37, 99, 235, 0.10), transparent 38%),
        radial-gradient(circle at 88% 12%, rgba(124, 58, 237, 0.08), transparent 40%),
        linear-gradient(180deg, #ffffff 0%, #f3f4f6 100%);
      color: #0f172a;
    }

    ::selection {
      background: rgba(37, 99, 235, 0.2);
    }

    .glass {
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .brand-gradient {
      background: linear-gradient(90deg, #2563eb, #7c3aed);
    }

    .text-brand {
      color: #2563eb;
    }

    .border-brand {
      border-color: rgba(37, 99, 235, 0.14);
    }

    .section-heading::after {
      content: '';
      display: block;
      width: 78px;
      height: 4px;
      border-radius: 999px;
      margin-top: 14px;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
    }

    .card-hover {
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow:
        0 22px 60px rgba(37, 99, 235, 0.20),
        0 10px 28px rgba(124, 58, 237, 0.14);
      border-color: rgba(37, 99, 235, 0.18);
    }

    .nav-link {
      position: relative;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 160ms ease;
    }

    .nav-link:hover::after,
    .nav-link:focus-visible::after {
      transform: scaleX(1);
    }

    .focus-ring:focus-visible {
      outline: 3px solid rgba(59, 130, 246, 0.45);
      outline-offset: 3px;
    }

    /* RGB hover lights (buttons + sections/cards) */
    @property --rgb-angle {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    @keyframes rgb-spin {
      to { --rgb-angle: 360deg; }
    }

    .rgb-interactive,
    .card-hover {
      position: relative;
      isolation: isolate;
    }

    .rgb-interactive::before,
    .card-hover::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: inherit;
      background: conic-gradient(
        from var(--rgb-angle),
        rgba(37, 99, 235, 0.22),
        rgba(124, 58, 237, 0.20),
        rgba(96, 165, 250, 0.14),
        rgba(37, 99, 235, 0.22)
      );
      filter: blur(18px);
      opacity: 0;
      transform: translateZ(0);
      transition: opacity 180ms ease;
      z-index: -1;
      pointer-events: none;
    }

    .rgb-interactive:hover::before,
    .card-hover:hover::before {
      opacity: 0.95;
      animation: rgb-spin 4.5s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .rgb-interactive:hover::before,
      .card-hover:hover::before {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const menuItems = [
      { label: 'Home', href: '#home' },
      { label: 'Services', href: '#services' },
      { label: 'Fresher Zone', href: '#fresher-zone' },
      { label: 'Resources', href: '#resources' },
      { label: 'Forum', href: '#forum' },
      { label: 'Contact Us', href: '#contact' },
    ];

    const quickHelpItems = [
      { title: 'Career Guidance', icon: 'briefcase', href: 'service.html?topic=Career%20Guidance', description: 'Plan your next step with career advisors and industry-ready guidance.' },
      { title: 'Mental Health Support', icon: 'heart', href: 'service.html?topic=Mental%20Health%20Support', description: 'Find a safe, supportive space for wellbeing and emotional care.' },
      { title: 'Raise a Complaint', icon: 'alert', href: 'service.html?topic=Raise%20a%20Complaint', description: 'Submit issues quickly and track resolution with transparency.' },
      { title: 'Fresher Help Center', icon: 'spark', href: 'service.html?topic=Fresher%20Help%20Center', description: 'Get started on campus with onboarding, tips, and essential links.' },
      { title: 'Mentor Connect', icon: 'mentor', href: 'service.html?topic=Mentor%20Connect', description: 'Join with mentors for academic, personal, and career support.' },
      { title: 'Emergency Help', icon: 'shield', href: 'service.html?topic=Emergency%20Help', description: 'Reach urgent support channels when you need immediate assistance.' },
    ];

    const services = [
      'Career Guidance',
      'Mental Health Support',
      'Complaint Management',
      'Fresher Help Center',
      'Mentor Connect',
      'Student Community Forum',
    ];

    const stats = [
      { value: '1500+', label: 'Students Helped' },
      { value: '500+', label: 'Queries Solved' },
      { value: '95%', label: 'Complaint Resolution' },
      { value: '100+', label: 'Active Mentors' },
    ];

    const announcements = [
      'Latest Workshop: Resume Building and Interview Skills',
      'Placement Drive opening next week for final-year students',
      'Internship Opportunities posted in the career portal',
      'Campus update: new support sessions added for freshers',
    ];

    const resources = [
      'Academic Calendar',
      'Placement Portal',
      'Exam Timetable',
      'Scholarship Information',
    ];

    const studyMaterials = [
      { title: 'Notes', icon: 'book', description: 'Subject-wise notes, PDFs, and summaries.', href: 'study-material.html?type=Notes' },
      { title: 'Exam Material', icon: 'exam', description: 'Important questions, patterns, and revision material.', href: 'study-material.html?type=Exam%20Material' },
      { title: 'PYQs', icon: 'calendar', description: 'Previous year question papers with quick filters.', href: 'study-material.html?type=PYQs' },
      { title: 'Lab Files', icon: 'flask', description: 'Lab manuals, experiment files, and submissions.', href: 'study-material.html?type=Lab%20Files' },
    ];

    const Icon = ({ name }) => {
      const common = 'w-6 h-6 text-white';
      switch (name) {
        case 'briefcase':
          return (
            <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <rect x="3" y="7" width="18" height="14" rx="3" />
              <path d="M9 7V6a3 3 0 0 1 6 0v1" />
              <path d="M3 13h18" />
            </svg>
          );
        case 'heart':
          return (
            <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z" />
            </svg>
          );
        case 'alert':
          return (
            <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M10.3 4.2 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3l-7.5-12.8a2 2 0 0 0-3.4 0Z" />
              <path d="M12 9v4" />
              <path d="M12 17h.01" />
            </svg>
          );
        case 'spark':
          return (
            <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Z" />
            </svg>
          );
        case 'mentor':
          return (
            <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M16 11a4 4 0 1 0-8 0" />
              <path d="M12 14v7" />
              <path d="M5 19c1.6-2.8 4.1-4 7-4s5.4 1.2 7 4" />
            </svg>
          );
        case 'shield':
          return (
            <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
              <path d="M12 8v5" />
              <path d="M12 17h.01" />
            </svg>
          );
        case 'search':
          return (
            <svg className="w-5 h-5 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
          );
        case 'calendar':
          return (
            <svg className="w-5 h-5 text-campus-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="17" rx="3" />
              <path d="M8 2v4" />
              <path d="M16 2v4" />
              <path d="M3 10h18" />
            </svg>
          );
        case 'portal':
          return (
            <svg className="w-5 h-5 text-campus-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M4 19a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2" />
              <rect x="5" y="3" width="14" height="14" rx="2" />
            </svg>
          );
        case 'exam':
          return (
            <svg className="w-5 h-5 text-campus-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M7 3h10a2 2 0 0 1 2 2v14l-7-3-7 3V5a2 2 0 0 1 2-2Z" />
            </svg>
          );
        case 'scholarship':
          return (
            <svg className="w-5 h-5 text-campus-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="5" />
              <path d="M8 14l-1 7 5-3 5 3-1-7" />
            </svg>
          );
        case 'chat':
          return (
            <svg className="w-5 h-5 text-campus-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M4 5h16v11H7l-3 3V5Z" />
            </svg>
          );
        case 'book':
          return (
            <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M4 19a2 2 0 0 0 2 2h14" />
              <path d="M4 4a2 2 0 0 1 2-2h14v18H6a2 2 0 0 0-2 2V4Z" />
              <path d="M8 6h8" />
              <path d="M8 10h8" />
              <path d="M8 14h6" />
            </svg>
          );
        case 'flask':
          return (
            <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M10 2v6l-5.2 9A3 3 0 0 0 7.4 21h9.2a3 3 0 0 0 2.6-4l-5.2-9V2" />
              <path d="M8.5 2h7" />
              <path d="M7 16h10" />
            </svg>
          );
        default:
          return null;
      }
    };

    const SectionTitle = ({ eyebrow, title, description }) => (
      <div className="mb-8">
        <p className="text-sm font-semibold uppercase tracking-[0.22em] text-campus-700 mb-2">{eyebrow}</p>
        <h2 className="section-heading text-2xl md:text-3xl font-bold text-slate-900">{title}</h2>
        {description && <p className="mt-4 text-slate-600 max-w-3xl">{description}</p>}
      </div>
    );

    const { useEffect, useState } = React;

    const App = () => {
      const currentYear = new Date().getFullYear();
      const [user, setUser] = useState(null);
      const [profileOpen, setProfileOpen] = useState(false);

      useEffect(() => {
        try {
          const stored = localStorage.getItem('loggedInUser');
          setUser(stored ? JSON.parse(stored) : null);
        } catch (e) {
          setUser(null);
        }
      }, []);

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key === 'Escape') setProfileOpen(false);
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      const logout = () => {
        try { localStorage.removeItem('loggedInUser'); } catch (e) {}
        setUser(null);
        setProfileOpen(false);
      };

      return (
        <div className="min-h-screen font-sans text-slate-900">
          <header className="sticky top-0 z-50 border-b border-white/40 bg-white/70 backdrop-blur-xl">
                <div className="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
              <a href="#home" className="flex items-center gap-3 focus-ring rounded-2xl px-1 py-1" aria-label="CampusCare home">
                <div className="flex h-12 w-12 items-center justify-center overflow-hidden rounded-2xl bg-white shadow-glow">
                  <img
                    src="assets/campuscare-logo-v2.jpg"
                    alt="CampusCare logo"
                    className="h-full w-full object-contain"
                    loading="eager"
                  />
                </div>
                <div>
                  <div className="text-lg font-extrabold tracking-tight text-slate-900">CampusCare</div>
                  <div className="text-xs font-medium text-slate-500">We care, we guide, we support</div>
                </div>
              </a>

              <nav className="hidden items-center gap-2 xl:flex" aria-label="Primary navigation">
                {menuItems.map((item) => (
                  <a key={item.label} href={item.href} className="nav-link focus-ring rounded-xl px-3 py-2 text-sm font-semibold text-slate-700 transition hover:text-campus-700">
                    {item.label}
                  </a>
                ))}
              </nav>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  aria-label="Search"
                  onClick={() => {
                    const baseUrl = window.location.href.split('#')[0];
                    const url = `search.html?source=${encodeURIComponent(baseUrl)}`;
                    window.open(url, '_blank', 'noopener,noreferrer');
                  }}
                  className="rgb-interactive focus-ring inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:border-campus-200 hover:text-brand"
                >
                  <Icon name="search" />
                </button>
                {user ? (
                  <div className="relative">
                    <button
                      type="button"
                      onClick={() => setProfileOpen((v) => !v)}
                      className="rgb-interactive focus-ring inline-flex items-center gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-700 shadow-sm transition hover:border-campus-200"
                      aria-haspopup="menu"
                      aria-expanded={profileOpen ? 'true' : 'false'}
                    >
                      <span className="inline-flex h-9 w-9 items-center justify-center rounded-2xl brand-gradient text-white shadow-sm">
                        {(user.name || user.email || 'U').toString().trim().slice(0, 1).toUpperCase()}
                      </span>
                      <span className="hidden max-w-[160px] truncate sm:inline">
                        {user.name || 'My Profile'}
                      </span>
                    </button>

                    {profileOpen && (
                      <div
                        role="menu"
                        className="absolute right-0 mt-3 w-72 rounded-3xl border border-slate-200 bg-white p-4 shadow-soft"
                      >
                        <p className="text-sm font-black text-slate-900">{user.name || 'Student'}</p>
                        <p className="mt-1 text-xs text-slate-500 break-all">{user.email}</p>
                        <div className="mt-4 grid gap-2">
                          <a
                            href="profile.html"
                            className="focus-ring inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-100"
                          >
                            View Profile
                          </a>
                          <button
                            type="button"
                            onClick={logout}
                            className="focus-ring inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-50"
                          >
                            Logout
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <a
                    href="login.html"
                    className="rgb-interactive focus-ring inline-flex items-center justify-center rounded-2xl brand-gradient px-5 py-3 text-sm font-bold text-white shadow-glow transition hover:-translate-y-0.5 hover:shadow-soft"
                  >
                    Login / Sign Up
                  </a>
                )}
              </div>
            </div>
          </header>

          <main id="home">
            <section className="hero relative overflow-hidden">
              <div className="hero-bg" aria-hidden="true"></div>
              <div className="hero-container container">
                <div className="grid items-center gap-10 lg:grid-cols-[1.15fr_0.85fr]">
                    <div className="max-w-3xl text-white animate-fadeUp">
                      <span className="inline-flex items-center rounded-full border border-white/15 bg-white/10 px-4 py-2 text-sm font-medium text-white/90 shadow-lg backdrop-blur-md">
                        University Student Support Portal
                      </span>
                      <h1 className="mt-6 text-4xl font-black tracking-tight sm:text-5xl lg:text-6xl">
                        We&apos;re Here To Help You Every Step of the Way
                      </h1>
                      <p className="mt-6 max-w-2xl text-base leading-8 text-slate-200 sm:text-lg">
                        Get support for your career, mental health, complaints, and connect with mentors.
                      </p>
                      <div className="mt-8 flex flex-col gap-3 sm:flex-row">
                        <a href="#services" className="rgb-interactive focus-ring inline-flex items-center justify-center rounded-2xl bg-white px-6 py-4 font-bold text-brand shadow-soft transition hover:-translate-y-0.5">
                          Get Support
                        </a>
                        <a href="#forum" className="rgb-interactive focus-ring inline-flex items-center justify-center rounded-2xl border border-white/20 bg-white/10 px-6 py-4 font-bold text-white backdrop-blur-md transition hover:bg-white/15">
                          Raise a Complaint
                        </a>
                        <a href="#resources" className="rgb-interactive focus-ring inline-flex items-center justify-center rounded-2xl border border-white/20 bg-transparent px-6 py-4 font-bold text-white transition hover:bg-white/10">
                          Find a Mentor
                        </a>
                      </div>
                    </div>

                    <div className="animate-floaty space-y-4">
                      <div className="overflow-hidden rounded-[2rem] border border-white/30 border-brand bg-white/10 shadow-soft backdrop-blur-md">
                        <div
                          role="img"
                          aria-label="GLA University logo"
                          className="h-44 w-full bg-white/95 bg-contain bg-center bg-no-repeat sm:h-52"
                          style={{ backgroundImage: "url('gla-logo.webp')" }}
                        ></div>
                        <div className="px-5 py-4 text-white/90">
                          <p className="text-sm font-semibold uppercase tracking-[0.18em]">GLA University</p>
                          <p className="mt-1 text-sm text-white/80">A student-first support network across campus life.</p>
                        </div>
                      </div>

                      <div className="glass card-hover rounded-[2rem] border border-white/30 p-6 shadow-soft">
                        <div className="grid gap-4 sm:grid-cols-2">
                          {[
                            { title: 'Support Queue', value: '24/7', note: 'Always on help desk' },
                            { title: 'Mentors Available', value: '100+', note: 'Guidance specialists' },
                            { title: 'Resolved Cases', value: '95%', note: 'Complaint resolution rate' },
                            { title: 'Student Reach', value: '1500+', note: 'Learners supported' },
                          ].map((item) => (
                            <div key={item.title} className="rounded-3xl border border-slate-200/80 bg-white/80 p-4 shadow-sm">
                              <p className="text-sm font-semibold text-slate-500">{item.title}</p>
                              <div className="mt-2 text-3xl font-black tracking-tight text-slate-900">{item.value}</div>
                              <p className="mt-2 text-sm text-slate-600">{item.note}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
            </section>

            <section className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
              <SectionTitle
                eyebrow="Quick Help"
                title="Fast access to the help students need most"
                description="Choose a support path in seconds with visually clear, accessible cards designed for student convenience."
              />
              <div className="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
                {quickHelpItems.map((item, index) => (
                  <a
                    key={item.title}
                    href={item.href || `service.html?topic=${encodeURIComponent(item.title)}`}
                    className="card-hover rounded-3xl border border-slate-200 bg-white p-6 shadow-soft animate-fadeUp block focus-ring"
                    style={{ animationDelay: `${index * 70}ms` }}
                  >

  <script>
    // Auto-sample dominant colors from the supplied GLA logo and apply them to CSS variables.
    // Runs in the browser when the page is opened locally.
    (function sampleLogoColors() {
      try {
        // If a brand color is already set (theme override), don't overwrite it.
        const currentPrimary = getComputedStyle(document.documentElement)
          .getPropertyValue('--brand-primary')
          .trim()
          .toLowerCase();
        if (currentPrimary && currentPrimary !== '#000000') return;

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = 'gla-logo.webp';
        img.addEventListener('load', () => {
          try {
            const w = 40; const h = 40;
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const data = ctx.getImageData(0, 0, w, h).data;

            // Reduce color precision to build a small histogram (4 bits per channel)
            const counts = Object.create(null);
            for (let i = 0; i < data.length; i += 4) {
              const r = data[i] >> 4;
              const g = data[i + 1] >> 4;
              const b = data[i + 2] >> 4;
              const key = (r << 8) | (g << 4) | b;
              counts[key] = (counts[key] || 0) + 1;
            }

            // Sort buckets by frequency
            const buckets = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

            const bucketToHex = (k) => {
              const ki = Number(k) || 0;
              const r = ((ki >> 8) & 0xf) << 4;
              const g = ((ki >> 4) & 0xf) << 4;
              const b = (ki & 0xf) << 4;
              const toHex = (n) => n.toString(16).padStart(2, '0');
              return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
            };

            const primary = bucketToHex(buckets[0]);
            const secondary = bucketToHex(buckets[1] || buckets[0]);
            const accent = bucketToHex(buckets[2] || buckets[1] || buckets[0]);

            const root = document.documentElement;
            root.style.setProperty('--brand-primary', primary);
            root.style.setProperty('--brand-secondary', secondary);
            root.style.setProperty('--brand-accent', accent);

            console.info('CampusCare: applied sampled brand colors', primary, secondary, accent);
          } catch (err) {
            console.warn('CampusCare: color sampling failed', err);
          }
        });
        img.addEventListener('error', () => console.warn('CampusCare: failed to load gla-logo.webp for sampling'));
      } catch (e) {
        console.warn('CampusCare: sampling script error', e);
      }
    })();
  </script>
