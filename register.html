<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register • CampusCare</title>
    <link rel="stylesheet" href="styles/premium.css" />
    <link rel="stylesheet" href="styles/auth.css" />
</head>
<body class="auth-page">

<a class="auth-back" href="campuscarehome.html">← Back to Home</a>

<main class="auth-layout">
    <section class="auth-card">
        <header class="auth-head">
            <h1 class="auth-title auth-title--center">Sign up</h1>
            <p class="auth-subtitle auth-subtitle--center">
                Already have an account? <a href="login.html">Log In</a>
            </p>
        </header>

        <div class="auth-socials" aria-label="Sign up options">
            <button class="auth-social" type="button">
                <!-- Google icon -->
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.1-.1-2.2-.4-3.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4c-7.7 0-14.4 4.3-17.7 10.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.3 0 10.2-2 13.9-5.2l-6.4-5.2C29.6 35.3 26.9 36 24 36c-5.2 0-9.6-3.3-11.2-7.9l-6.6 5.1C9.5 39.7 16.2 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.2 3.2-3.7 5.6-6.8 7.1l6.4 5.2C38.8 36.7 44 31.2 44 24c0-1.1-.1-2.2-.4-3.5z"/>
                </svg>
                Continue with Google
            </button>

            <button class="auth-social" type="button">
                <!-- Facebook icon -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#1877F2" d="M24 12a12 12 0 1 0-13.9 11.8v-8.3H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.3A12 12 0 0 0 24 12z"/>
                </svg>
                Continue with Facebook
            </button>

            <button class="auth-social" type="button">
                <!-- Apple icon -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#111827" d="M16.6 13.2c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3.1-1.6-1.3-.1-2.5.8-3.2.8-.6 0-1.6-.8-2.7-.8-1.4 0-2.6.8-3.3 2.1-1.4 2.4-.3 6 1 7.9.7.9 1.5 2 2.6 1.9 1-.1 1.4-.7 2.6-.7 1.2 0 1.5.7 2.7.7 1.1 0 1.8-1 2.5-1.9.8-1.2 1.1-2.4 1.2-2.4-.1-.1-2.1-.8-2.1-2.8zM14.6 6.9c.5-.7.9-1.6.8-2.6-.8 0-1.8.6-2.3 1.2-.5.6-.9 1.6-.8 2.5.9.1 1.8-.5 2.3-1.1z"/>
                </svg>
                Continue with Apple
            </button>
        </div>

        <div class="auth-divider" role="separator" aria-label="Or">
            <span></span>
            <b>or</b>
            <span></span>
        </div>

        <form id="registerForm" class="auth-form">
            <div class="auth-field">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@university.edu" autocomplete="email" required />
            </div>

            <div id="signupExtra" class="auth-extra is-hidden" aria-live="polite">
                <div class="auth-field">
                    <label for="name">Full name</label>
                    <input type="text" id="name" placeholder="Your name" autocomplete="name" data-required="true" />
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" data-required="true" />
                </div>
            </div>

            <div class="auth-actions">
                <button class="btn btn-primary" type="submit">Continue with Email</button>
            </div>

        </form>

        <p class="auth-terms">
            * By signing up, you agree to our <a href="#">Terms of Use</a> and acknowledge you've read our
            <a href="#">Privacy Policy</a>.
        </p>

    </section>
</main>

<script src="register.js"></script>

</body>
</html>
